name: Build AnimationSpeed v3 + Tweak dylib

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build TIPA + dylib
    runs-on: macos-15        # Xcode 16，支持 folder-sync 工程

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      # ---------- theos ----------
      - name: Install theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar xz -C "$THEOS"
          mv "$THEOS"/sdks-master/* "$THEOS"/sdks/ 2>/dev/null || true
          ls "$THEOS/sdks" | head -5

      - name: Setup fakeroot
        run: |
          brew update
          brew install fakeroot || brew install fakeroot-tcp || true

      - name: Setup ldid
        run: |
          brew install libplist libxml2
          mkdir -p $HOME/bin
          curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64" -o "$HOME/bin/ldid"
          chmod +x "$HOME/bin/ldid"
          echo "$HOME/bin" >> $GITHUB_PATH
          ldid -h 2>&1 | head -3

      - name: Install Perl XML modules for theos
        run: |
          cpan -T XML::LibXML
          cpan -T XML::SAX
          cpan -T XML::NamespaceSupport

      # ---------- Build APP (TIPA) ----------
      - name: Build App (TIPA)
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_STAGING_DIR: ${{ github.workspace }}/theos/sdks/iPhoneOS16.4.sdk/RootFS
        run: |
          cd ${{ github.workspace }}
          # Compile only (no fakeroot)
          make
          # Manually stage without fakeroot
          mkdir -p "$THEOS_STAGING_DIR/Applications/AnimationSpeed.app"
          cp -r ".theos/obj/AnimationSpeed.app/"* "$THEOS_STAGING_DIR/Applications/AnimationSpeed.app/"
          # Sign with ldid (no entitlements file needed, just inject)
          ldid -S "$THEOS_STAGING_DIR/Applications/AnimationSpeed.app/AnimationSpeed"
          # Embed companion helper
          cp RebootRootHelper "$THEOS_STAGING_DIR/Applications/AnimationSpeed.app/"
          # Package as .tipa (ios .deb format)
          mkdir -p packages
          dpkg-deb -Zgzip -b "$THEOS_STAGING_DIR" packages/com.developlab.animationspeed_3.0.0_iphoneos-arm.deb
          mv packages/com.developlab.animationspeed_3.0.0_iphoneos-arm.deb packages/AnimationSpeed_3.0.0.tipa
          echo "Build App done"
          ls -la packages/

      # ---------- Build dylib ----------
      - name: Build companion dylib
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_STAGING_DIR: ${{ github.workspace }}/theos/sdks/iPhoneOS16.4.sdk/RootFS
        run: |
          cd ${{ github.workspace }}/Tweak
          make
          make stage
          mkdir -p "$THEOS_STAGING_DIR/Library/MobileSubstrate/DynamicLibraries"
          cp -f ".theos/obj/AnimationSpeedTweak.dylib" "$THEOS_STAGING_DIR/Library/MobileSubstrate/DynamicLibraries/"
          cp -f layout/Library/MobileSubstrate/DynamicLibraries/AnimationSpeedTweak.plist "$THEOS_STAGING_DIR/Library/MobileSubstrate/DynamicLibraries/"
          mkdir -p ${{ github.workspace }}/packages/dylib
          cp -f ".theos/obj/AnimationSpeedTweak.dylib" "${{ github.workspace }}/packages/dylib/"
          # Package tweak as deb
          mkdir -p ${{ github.workspace }}/packages/tweak_deb
          dpkg-deb -Zgzip -b "$THEOS_STAGING_DIR" ${{ github.workspace }}/packages/tweak_deb/com.developlab.animationspeed.tweak_3.0.0_iphoneos-arm.deb
          ls -la "${{ github.workspace }}/packages/dylib/"

      # ---------- Pack artifacts ----------
      - name: Verify outputs
        run: |
          cd ${{ github.workspace }}
          echo "===== Final artifacts ====="
          find packages -type f -maxdepth 3
          file "${{ github.workspace }}/packages/dylib/"*.dylib 2>/dev/null || echo "(no dylib)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimationSpeed-v3-build
          path: |
            packages/*.tipa
            packages/dylib/*.dylib
          if-no-files-found: warn
