name: Build AnimationSpeed v3 + Tweak dylib

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build TIPA + dylib
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar xz -C "$THEOS"
          mv "$THEOS"/sdks-master/* "$THEOS"/sdks/ 2>/dev/null ; true
          ls "$THEOS/sdks" | head -5

      - name: Install ldid
        run: |
          brew install libplist libxml2
          mkdir -p $HOME/bin
          curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64" -o "$HOME/bin/ldid"
          chmod +x "$HOME/bin/ldid"
          echo "$HOME/bin" >> $GITHUB_PATH
          ldid -h 2>&1 | head -3

      - name: Install Perl XML modules for theos
        run: |
          cpan -T XML::LibXML
          cpan -T XML::SAX
          cpan -T XML::NamespaceSupport

      - name: Build App (TIPA)
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_STAGING_DIR: ${{ github.workspace }}/staging
        run: |
          cd ${{ github.workspace }}
          mkdir -p "$THEOS_STAGING_DIR/Applications/AnimationSpeed.app"
          make
          cp -r ".theos/obj/AnimationSpeed.app/"* "$THEOS_STAGING_DIR/Applications/AnimationSpeed.app/" 2>/dev/null ; true
          cp -f RebootRootHelper "$THEOS_STAGING_DIR/Applications/AnimationSpeed.app/" 2>/dev/null ; true
          ldid -S "$THEOS_STAGING_DIR/Applications/AnimationSpeed.app/AnimationSpeed" 2>/dev/null ; true
          cd "$THEOS_STAGING_DIR"
          zip -rq "${{ github.workspace }}/packages/AnimationSpeed_3.0.0.tipa" . -x ".*"
          echo "TIPA done"
          ls -la "${{ github.workspace }}/packages/"

      - name: Build companion dylib
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_STAGING_DIR: ${{ github.workspace }}/staging
        run: |
          cd ${{ github.workspace }}/Tweak
          make
          mkdir -p "$THEOS_STAGING_DIR/Library/MobileSubstrate/DynamicLibraries"
          cp -f ".theos/obj/AnimationSpeedTweak.dylib" "$THEOS_STAGING_DIR/Library/MobileSubstrate/DynamicLibraries/" 2>/dev/null ; true
          cp -f layout/Library/MobileSubstrate/DynamicLibraries/AnimationSpeedTweak.plist "$THEOS_STAGING_DIR/Library/MobileSubstrate/DynamicLibraries/" 2>/dev/null ; true
          mkdir -p ${{ github.workspace }}/packages/dylib
          cp -f ".theos/obj/AnimationSpeedTweak.dylib" "${{ github.workspace }}/packages/dylib/" 2>/dev/null ; true
          ls -la "${{ github.workspace }}/packages/dylib/"

      - name: Verify outputs
        run: |
          echo "===== Artifacts ====="
          find packages -type f 2>/dev/null
          file "${{ github.workspace }}/packages/dylib/"*.dylib 2>/dev/null ; echo "(no dylib)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimationSpeed-v3-build
          path: |
            packages/*.tipa
            packages/dylib/*.dylib
          if-no-files-found: warn
